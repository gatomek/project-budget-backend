services:
  create-db:
    container_name: ansible_create_db
    build:
      context: .
      dockerfile: ansible.Dockerfile
    command: ansible-playbook -i inventory.ini playbooks/create-db.yml
  setup-app:
    container_name: ansible_setup_app
    build:
      context: .
      dockerfile: ansible.Dockerfile
    command: ansible-playbook -i inventory.ini playbooks/setup-app.yml
