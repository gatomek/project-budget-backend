- name: "Setup Application Database"
  gather_facts: no
  vars_files:
    - vars/prod.yml
  hosts: castle
  remote_user: gatomek
  tasks:
    - name: "Create database {{ db_name }}"
      become_user: postgres
      become: yes
      postgresql_db:
        state: present
        name: "{{ db_name }}"
        port: "{{ db_port }}"

    - name: "Create db user {{ db_name }}"
      become_user: postgres
      become: yes
      postgresql_user:
        state: present
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        port: "{{ db_port }}"

    - name: "Create a new schema budget with a user {{ db_name }} who will own it"
      become_user: postgres
      become: yes
      community.postgresql.postgresql_schema:
        database: "{{ db_name }}"
        name: budget
        owner: "{{ db_user }}"
        port: "{{ db_port }}"

    - name: "Create a new schema liquibase with a user {{ db_name }} who will own it"
      become_user: postgres
      become: yes
      community.postgresql.postgresql_schema:
        database: "{{ db_name }}"
        name: liquibase
        owner: "{{ db_user }}"
        port: "{{ db_port }}"

    - name: "Allow external connection for the db user"
      become: yes
      become_user: postgres
      postgresql_pg_hba:
        dest: "/etc/postgresql/16/main/pg_hba.conf"
        contype: host
        databases: "{{ db_name }}"
        method: scram-sha-256
        users: "{{ db_user }}"
        create: true
        address: 0.0.0.0/0
      register: pg_hba_result

    - name: "Reload service postgresql when authentication rules change"
      become: yes
      systemd:
        name: postgresql
        state: reloaded
      when: pg_hba_result.changed
